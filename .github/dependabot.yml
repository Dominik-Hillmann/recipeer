version: 2

updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Berlin
    labels:
      - Dependabot
      - Docker

  - package-ecosystem: github-actions
    directory: /.github
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Berlin
    labels:
      - Dependabot
      - GitHub Actions
    groups:
      all-updates:
        patterns:
          - actions/*
